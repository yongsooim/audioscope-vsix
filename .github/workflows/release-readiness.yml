name: Release readiness
on:
  workflow_dispatch:
  push:
    branches: [codex/native-audio-release-readiness]
  pull_request:
    paths: ['src/**', 'src-webview/**', 'src-wasm/embedded/**', 'scripts/**', 'package.json', 'bun.lock', '.github/workflows/release-readiness.yml']
permissions:
  contents: read
concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.21'
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.15.2'
      - run: sudo apt-get update && sudo apt-get install -y nasm pkg-config
      - uses: actions/cache@v4
        with:
          path: .ffmpeg-build
          key: shared-emsdk-4.0.21-${{ hashFiles('scripts/build-embedded-media-tools.mts', 'scripts/audio-codec-config.mts', 'src-wasm/embedded/**', '.gitmodules') }}
      - run: bun install --frozen-lockfile
      - run: bun run compile
      - run: bun run test:performance
      - run: tar -czf shared-runtime.tar.gz out dist/embedded-tools dist/wasm dist/webview .ffmpeg-build/lame-3.100.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: shared-runtime
          path: shared-runtime.tar.gz
  native:
    needs: shared
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-14 }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: linux-arm64, runner: ubuntu-22.04-arm }
          - { target: linux-x64, runner: ubuntu-22.04 }
          - { target: win32-arm64, runner: windows-11-arm, msystem: CLANGARM64, compiler: clang, packages: 'clang:p pkgconf:p' }
          - { target: win32-x64, runner: windows-2022, msystem: UCRT64, compiler: gcc, packages: 'gcc:p pkgconf:p nasm:p' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: true
          install: make diffutils tar gzip
          pacboy: ${{ matrix.packages }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm pkg-config xvfb libgtk-3-0 libgbm1 libasound2
      - if: runner.os == 'macOS'
        run: brew install pkg-config nasm
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: shared-runtime
      - uses: actions/cache@v4
        with:
          path: .ffmpeg-build/native-${{ matrix.target }}
          key: native-${{ matrix.target }}-${{ hashFiles('scripts/build-native-media-tools.mts', 'scripts/audio-codec-config.mts', '.gitmodules') }}
      - if: runner.os != 'Windows'
        run: tar -xzf shared-runtime.tar.gz
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: tar -xzf shared-runtime.tar.gz
      - if: runner.os != 'Windows'
        run: bun run build:native-media-tools
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC: ${{ matrix.compiler }}
        run: bun run build:native-media-tools
      - run: bunx tsx --test scripts/native-platform.test.mts scripts/native-media-tools.test.mts
      - run: bun run package:release ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1600x1200x24" bun run test:vsix .artifacts/release/audioscope-1.1.9-${{ matrix.target }}.vsix
      - if: runner.os != 'Linux'
        run: bun run test:vsix .artifacts/release/audioscope-1.1.9-${{ matrix.target }}.vsix
      - if: runner.os != 'Windows'
        run: tar -czf native-${{ matrix.target }}.tar.gz -C .artifacts/native-tools ${{ matrix.target }}
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: tar -czf native-${{ matrix.target }}.tar.gz -C .artifacts/native-tools ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ matrix.target }}
          include-hidden-files: true
          path: |
            .artifacts/release/*.vsix
            native-*.tar.gz
            .artifacts/native-tools/**
            .artifacts/vsix-test/**/results.json
            .artifacts/vsix-test/**/*.png
            .artifacts/vsix-test/**/logs/**/*.log
            .artifacts/vsix-test/**/settings.json
            .ffmpeg-build/native-*/ffmpeg/ffbuild/config.log
            .ffmpeg-build/native-*/lame-3.100/config.log
  universal:
    needs: shared
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: shared-runtime
      - run: tar -xzf shared-runtime.tar.gz
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libgbm1 libasound2
      - run: bun run package:release universal
      - run: xvfb-run -a --server-args="-screen 0 1600x1200x24" bun run test:vsix .artifacts/release/audioscope-1.1.9-universal.vsix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-universal
          include-hidden-files: true
          path: |
            .artifacts/release/*.vsix
            .artifacts/vsix-test/**/results.json
            .artifacts/vsix-test/**/*.png
            .artifacts/vsix-test/**/logs/**/*.log
            .artifacts/vsix-test/**/settings.json
